; ============================================================
;  网站设定（Individual's Utmost Achievement Calculator）
;  用记事本打开修改，存档后重新启动 exe / python app.py 就会生效。
;  「;」开头的是说明，不会被读取。
;  exe 版：放在 exe 旁边的 config\config.ini 会优先采用（不用重新打包）。
;  启动时加上的参数（例：--lan）会盖过这里的设定。
; ============================================================

[server]
; 谁可以打开网站：
;   local = 只有这台电脑（最安全，平常用这个）
;   lan   = 同一个网络的同事也可以用 http://这台电脑的IP:端口 打开
access = local

; 网站端口（1024 ~ 65535）。同事要用的网址就是 http://IP:这个号码
port = 5000

; 端口被别的程序占用时：yes = 自动改用下一个（5001、5002…）；no = 直接停止并提示
port_fallback = yes

; 启动时自动打开浏览器：yes / no
open_browser = yes

; access = lan 时，同事可不可以改「计入 / 不计」：no = 只能在这台电脑改（建议）；yes = 同事也可以改
lan_allow_edit = no

[data]
; 学生履历表的文件夹。可以写相对路径（相对于 exe / 项目根目录），或完整路径，例：D:\资料\Result
result_folder = Result
